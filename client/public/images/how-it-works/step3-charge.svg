      <stop offset="0%" stop-color="#061A14" /><stop offset="100%" stop-color="#0E392B" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg3)" rx="24" />
  <!-- Wall Mount 16A Socket -->
  <rect x="60" y="80" width="110" height="140" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="2" />
  <circle cx="115" cy="130" r="10" fill="#061A14" />
  <circle cx="100" cy="165" r="7.5" fill="#061A14" />
