<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#081E17" rx="20" />
  <!-- Decentralized Network Node Mesh -->
  <g stroke="#10B981" stroke-width="2" opacity="0.6">
    <line x1="120" y1="120" x2="280" y2="100" />
    <line x1="280" y1="100" x2="440" y2="140" />
    <line x1="280" y1="100" x2="300" y2="240" />
    <line x1="120" y1="120" x2="200" y2="260" />
    <line x1="200" y1="260" x2="300" y2="240" />
    <line x1="300" y1="240" x2="460" y2="270" />
    <line x1="440" y1="140" x2="460" y2="270" />
  </g>
  <!-- Node Circles with Labels -->
  <circle cx="120" cy="120" r="14" fill="#10B981" />
  <circle cx="280" cy="100" r="18" fill="#10B981" />
  <circle cx="440" cy="140" r="14" fill="#10B981" />
  <circle cx="200" cy="260" r="14" fill="#10B981" />
  <circle cx="300" cy="240" r="20" fill="#059669" stroke="#10B981" stroke-width="3" />
  <circle cx="460" cy="270" r="14" fill="#10B981" />
  <text x="300" y="350" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold">Bengaluru Peer-to-Peer 16A Grid</text>
</svg>