        <circle cx="80" cy="180" r="36" fill="#f8fafc" stroke="#475569" stroke-width="6"/>
        <circle cx="80" cy="180" r="22" fill="#0284c7"/>
        <circle cx="300" cy="180" r="36" fill="#f8fafc" stroke="#475569" stroke-width="6"/>
        <circle cx="300" cy="180" r="22" fill="#0284c7"/>
