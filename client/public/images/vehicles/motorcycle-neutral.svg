<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#061A14" rx="20" />
  <!-- Neutral Electric Motorcycle Illustration -->
  <g transform="translate(50, 40)">
    <circle cx="50" cy="155" r="42" fill="#0F172A" stroke="#475569" stroke-width="8" />
    <circle cx="240" cy="155" r="42" fill="#0F172A" stroke="#475569" stroke-width="8" />
    <!-- Trellis Frame & Battery Mid-Drive -->
    <path d="M 70 155 L 140 100 L 220 100 L 200 155 Z" fill="#0E231C" stroke="#3B82F6" stroke-width="2" />
    <!-- Tank & Fairing -->
    <path d="M 110 90 L 160 50 L 210 65 L 190 100 Z" fill="#2563EB" />
    <!-- Seat -->
    <path d="M 80 85 C 90 75, 140 75, 150 85 Z" fill="#020617" />
    <!-- Handlebar -->
    <line x1="210" y1="65" x2="225" y2="40" stroke="#64748B" stroke-width="5" />
    <circle cx="150" cy="125" r="8" fill="#3B82F6" />
  </g>
  <text x="200" y="260" text-anchor="middle" fill="#93C5FD" font-family="sans-serif" font-size="13" font-weight="bold">Electric Motorcycle</text>
  <text x="200" y="280" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="10">Standard 16A 3-Pin Socket Ready</text>
</svg>