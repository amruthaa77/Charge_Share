<svg width="400" height="260" viewBox="0 0 400 260" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="400" height="260" rx="16" fill="#0f172a"/>
        <!-- Rear Wheel -->
        <circle cx="80" cy="180" r="36" fill="#1e293b" stroke="#f59e0b" stroke-width="4"/>
        <circle cx="80" cy="180" r="18" fill="#0f172a"/>
        <!-- Front Wheel -->
        <circle cx="300" cy="180" r="36" fill="#1e293b" stroke="#f59e0b" stroke-width="4"/>
        <circle cx="300" cy="180" r="18" fill="#0f172a"/>
        <!-- Sharp Sport Fairing -->
        <polygon points="90,165 130,95 210,95 260,140 240,165" fill="#f59e0b"/>
        <path d="M110 95 L180 85 L205 95 Z" fill="#0f172a"/>
        <!-- Steering -->
        <line x1="300" y1="180" x2="260" y2="40" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
        <line x1="245" y1="35" x2="275" y2="35" stroke="#f8fafc" stroke-width="6" stroke-linecap="round"/>
        <!-- Badge -->
        <rect x="15" y="15" width="80" height="22" rx="11" fill="#78350f"/>
        <text x="55" y="30" fill="#fde68a" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">SPORT EV</text>
      </svg>