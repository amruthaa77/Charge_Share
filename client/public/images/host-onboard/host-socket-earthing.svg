<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#04120E" rx="20" />
  <!-- Earthing Multimeter -->
  <rect x="220" y="80" width="160" height="240" rx="20" fill="#0F172A" stroke="#10B981" stroke-width="3" />
  <rect x="245" y="110" width="110" height="60" rx="8" fill="#061A14" stroke="#1E293B" stroke-width="2" />
  <text x="300" y="148" text-anchor="middle" fill="#10B981" font-family="monospace" font-size="24" font-weight="bold">1.8 V</text>
  <text x="300" y="163" text-anchor="middle" fill="#6EE7B7" font-family="sans-serif" font-size="9">EARTHING POTENTIAL</text>
  <!-- Test Probes connected to socket -->
  <path d="M 260 300 C 260 340, 140 330, 140 280 L 140 220" fill="none" stroke="#DC2626" stroke-width="3" />
  <path d="M 340 300 C 340 340, 460 330, 460 280 L 460 220" fill="none" stroke="#000000" stroke-width="3" />
  <rect x="100" y="140" width="80" height="90" rx="10" fill="#1E293B" stroke="#10B981" stroke-width="2" />
  <circle cx="140" cy="185" r="8" fill="#061A14" />
  <!-- Stamp -->
  <g transform="translate(420, 110)">
    <circle cx="40" cy="40" r="32" fill="#059669" opacity="0.2" stroke="#10B981" stroke-width="2" />
    <text x="40" y="44" text-anchor="middle" fill="#10B981" font-family="sans-serif" font-size="11" font-weight="bold">PASSED</text>
  </g>
  <text x="300" y="360" text-anchor="middle" fill="#A7F3D0" font-family="sans-serif" font-size="12">Earthing Verified (&lt; 5V Neutral-Earth) for Battery Safety</text>
</svg>