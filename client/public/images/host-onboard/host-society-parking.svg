<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#0B1B15" rx="20" />
  <!-- Society Basement Parking Columns -->
  <rect x="80" y="40" width="50" height="320" fill="#1E293B" stroke="#334155" />
  <rect x="470" y="40" width="50" height="320" fill="#1E293B" stroke="#334155" />
  <!-- Individual sub-metered socket on pillar -->
  <rect x="140" y="160" width="90" height="110" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="2" />
  <text x="185" y="195" text-anchor="middle" fill="#10B981" font-family="sans-serif" font-size="10" font-weight="bold">BAY #14</text>
  <circle cx="185" cy="225" r="14" fill="#061A14" />
  <!-- Scooter parked in slot -->
  <g transform="translate(250, 180)">
    <circle cx="50" cy="110" r="28" fill="#0F172A" stroke="#64748B" stroke-width="6" />
    <circle cx="160" cy="110" r="28" fill="#0F172A" stroke="#64748B" stroke-width="6" />
    <path d="M 60 110 L 150 110 L 135 70 L 70 70 Z" fill="#10B981" />
  </g>
  <text x="300" y="360" text-anchor="middle" fill="#E2E8F0" font-family="sans-serif" font-size="12">Sub-Metered Apartment Society Parking Bay</text>
</svg>