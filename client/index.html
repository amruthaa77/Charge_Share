<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230E9F6E'><path d='M13 2L3 14h9l-1 8 10-12h-9l1-8z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#EAF6F4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#061A14" />
    <meta name="color-scheme" content="light dark" />
    <title>ChargeShare India | Bengaluru EV Two-Wheeler Network</title>
    <meta name="description" content="Bengaluru's verified peer-to-peer 16A electric two-wheeler charging network. Discover verified sockets, book slots, and monetize your bay." />
    <!-- Preload Critical Above-The-Fold Fonts -->
    <link rel="preload" href="/fonts/fraunces-latin-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin-variable.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Single source of truth theme initialization before paint -->
    <script>
      (function() {
        try {
          var urlTheme = new URLSearchParams(window.location.search).get('theme');
          var saved = localStorage.getItem('cs_theme');
          var theme = urlTheme || saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          if (urlTheme) {
            try { localStorage.setItem('cs_theme', urlTheme); } catch (e) {}
          }
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </head>
  <body class="min-h-screen min-h-[100dvh] antialiased font-sans overflow-x-clip">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
